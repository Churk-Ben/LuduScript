name: LuduScript Auto Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0, v1.2.3 等标签时触发
    branches:
      - main
      - master

permissions:
  contents: write  # 需要写入权限创建 release

env:
  PROJECT_NAME: LuduScript

jobs:
  build-and-package:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: luduscript-linux-amd64.tar.gz
            triplet: x64-linux
          - os: windows-latest
            artifact: luduscript-windows-amd64.zip
            triplet: x64-windows
          - os: macos-latest
            artifact: luduscript-macos-amd64.tar.gz
            triplet: x64-osx

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于版本提取

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'project\(LuduScript VERSION \K[0-9.]+' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"

      # 安装系统依赖
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: 安装 macOS 依赖
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: 配置 Windows 环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # 配置项目
      - name: 配置 CMake
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      # 编译项目
      - name: 编译
        shell: bash
        run: cmake --build build --parallel

      # 运行测试
      - name: 运行测试
        shell: bash
        working-directory: build
        run: ctest --verbose --output-on-failure

      # 安装到本地目录
      - name: 安装项目
        shell: bash
        run: cmake --install build

      # 创建发布包
      - name: 打包
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=${{ matrix.artifact }}
          echo "Creating package: $PACKAGE_NAME"
          
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows: 使用 zip
            cd install
            7z a -r ../$PACKAGE_NAME .
            cd ..
          else
            # Linux/macOS: 使用 tar.gz
            tar -czf $PACKAGE_NAME -C install .
          fi
          
          # 验证包内容
          echo "Package contents:"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z l $PACKAGE_NAME | head -20
          else
            tar -tzf $PACKAGE_NAME | head -20
          fi
          
          echo "artifact=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      # 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

  create-release:
    name: 创建 Release
    needs: build-and-package
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep -oP 'project\(LuduScript VERSION \K[0-9.]+' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 准备发布文件
        run: |
          ls -la artifacts/
          # 将文件移动到根目录以便上传
          find artifacts/ -type f -name "*.tar.gz" -o -name "*.zip" | while read file; do
            mv "$file" .
            basename "$file"
          done
          ls -la *.tar.gz *.zip 2>/dev/null || true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name:  LuduScript ${{ github.ref_name }} Release
          body: |
            ## LuduScript ${{ steps.version.outputs.version }} 🎲
            
            LuduScript 是一个用于游戏卡片生成的领域特定语言。
            
            ### 更新内容
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 了解本次发布的详细信息。
            
            ### 使用说明
            1. 下载对应平台的压缩包
            2. 解压到任意目录
            3. 运行 `bin/luduscript` (Linux/macOS) 或 `bin/luduscript.exe` (Windows)
            
            ### 示例
            ```bash
            luduscript scripts/generate_poker_deck.gen --pretty --output poker_deck.json
            ```
            
            ### 包含内容
            - 可执行文件 (`bin/luduscript`)
            - 脚本示例 (`share/luduscript/scripts/`)
            - 使用示例 (`share/luduscript/examples/`)
            
            ### 平台支持
            - ✅ Linux (AMD64)
            - ✅ Windows (AMD64)
            - ✅ macOS (AMD64)
          files: |
            *.tar.gz
            *.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          
      - name: 清理旧产物
        if: always()
        uses: geekyeggo/delete-artifact@v4
        with:
          name: '*'